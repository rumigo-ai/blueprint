[project]
name = "blueprint"
version = "0.1.0"
description = "Blueprint monorepo scaffold — Vite web + FastAPI with Clerk"
authors = [{ name = "Sushant S Samuel", email = "iam@robosushie.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic (>=1.18.4,<2.0.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "fastapi (>=0.136.0,<0.137.0)",
    "psycopg (>=3.3.3,<4.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "clerk-backend-api (>=5.0.6,<6.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "python-multipart (>=0.0.27,<0.0.28)",
    "email-validator (>=2.2.0,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
mypy = "^1.20.1"
ruff = "^0.15.11"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
